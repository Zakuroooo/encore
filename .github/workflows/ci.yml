name: ci

on:
  push:
  pull_request:

jobs:
  pipeline-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The raw file is public but 128 MB; cache it by its pinned SHA-256 so CI does not re-download every run.
      - name: Cache raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: sparkify-mini-94620a8c00036956

      - name: Run the whole pipeline (download, build, quality checks, model, decision)
        run: python pipeline.py

      - name: Tests
        run: python -m pytest -v

      - name: Committed outputs must match a fresh run
        run: git diff --stat --exit-code -- outputs/
